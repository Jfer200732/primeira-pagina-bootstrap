<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário</title>
  

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
</head>
<body id="inicio">

  <div class="container-fluid py-4">
    <form action="destino.php">


      <div class="row mb-3">
        <div class="form-group col-md-6">
          <label for="inputNome">Nome</label>
          <input type="text" class="form-control" id="inputNome">
        </div>
        <div class="form-group col-md-6">
          <label for="inputSobrenome">Sobrenome</label>
          <input type="text" class="form-control" id="inputSobrenome">
        </div>
      </div>

      <div class="row mb-3">
        <div class="form-group col-md-6">
          <label for="inputEmail">Email</label>
          <input type="email" class="form-control" id="inputEmail">
        </div>
        <div class="form-group col-md-6">
          <label for="inputTelefone">Telefone</label>
          <input type="tel" class="form-control" id="inputTelefone">
        </div>
      </div>


      <div class="row mb-3">
        <div class="form-group col-12">
          <label for="inputMorada">Morada</label>
          <textarea class="form-control" id="inputMorada" rows="3"></textarea>
        </div>
      </div>


      <div class="row mb-3">
        <div class="form-group col-12">
          <label for="inputMorada2">Morada 2</label>
          <textarea class="form-control" id="inputMorada2" rows="3"></textarea>
        </div>
      </div>

      <div class="row mb-4">
        <!-- Hobbies (Checkboxes) -->
        <div class="col-md-6 mb-3 mb-md-0">
          <span class="me-2">Hobbies:</span>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="cinema" value="cinema">
            <label class="form-check-label" for="cinema">Cinema</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="musica" value="musica">
            <label class="form-check-label" for="musica">Música</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="culinaria" value="culinaria">
            <label class="form-check-label" for="culinaria">Culinária</label>
          </div>
        </div>

        <div class="col-md-6">
          <span class="me-2">Género:</span>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="genero" id="feminino" value="feminino">
            <label class="form-check-label" for="feminino">Feminino</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="genero" id="masculino" value="masculino">
            <label class="form-check-label" for="masculino">Masculino</label>
          </div>
        </div>
      </div>

      <div>
        <button type="reset" class="btn btn-outline-secondary">cancelar</button>
        <button type="submit" class="btn btn-primary">enviar</button>
      </div>

    </form>
  </div>


  <script src="https://code.jquery.com/jquery-3.6.1.min.js" integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3" crossorigin="anonymous"></script>
</body>
</html>
